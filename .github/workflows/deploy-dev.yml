name: Deploy Dev

# Builds the server and web Docker images, pushes to Docker Hub, then
# deploys on the Windows desktop host through its self-hosted runner.
# Mirrors the HomeProject deployment pattern documented in
# skills/deployment/SKILL.md, without inbound SSH.
#
# Deploy target (canonical):
#   - Host: Windows desktop, Tailscale IP 100.83.112.20
#   - Public hostname: hunter.sisihome.org (TLS terminated by RPi Caddy
#     which proxies to 100.83.112.20:8100)
#   - NOT the Manjaro Pi/server. The Manjaro RPi only runs the front
#     Caddy reverse proxy; greed-island services run on the desktop.
#
# Required GitHub secrets (org-level on `kevinsisi`, inherited by this
# repo via Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME    Docker Hub user (e.g. kevin950805)
#   DOCKERHUB_TOKEN       Docker Hub access token
#   Self-hosted runner    DESK-KEVINHOME-greed-island-2, labels:
#                         self-hosted, Windows, X64,
#                         greed-island-desktop, docker
#
# Required GitHub variables (repo-level on this repo):
#   DEPLOY_PATH           Path to the deploy directory on the desktop
#                         (e.g. /d/GitClone/_HomeProject/greed-island/deploy
#                         under Git-Bash on Windows)

on:
  # Only deploy after CI passes on main — prevents broken builds from reaching the desktop.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Keep manual trigger for hotfix deploys; bypasses CI gate by operator intent.
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  IMAGE_BASE: ${{ secrets.DOCKERHUB_USERNAME }}
  SERVER_IMAGE: greed-island-server
  WEB_IMAGE: greed-island-web

jobs:
  publish:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    # For workflow_run: only proceed when CI succeeded.
    # For workflow_dispatch: always proceed (operator override).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag-sha: ${{ steps.meta.outputs.tag-sha }}
    steps:
      - name: Checkout
        # Use the SHA that triggered CI (not the default-branch head) so we build
        # exactly the code that passed tests.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute image tag
        id: meta
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "tag-sha=${sha::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_BASE }}/${{ env.SERVER_IMAGE }}:dev
            ${{ env.IMAGE_BASE }}/${{ env.SERVER_IMAGE }}:${{ steps.meta.outputs.tag-sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_BASE }}/${{ env.WEB_IMAGE }}:dev
            ${{ env.IMAGE_BASE }}/${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.tag-sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to desktop
    needs: publish
    runs-on: [self-hosted, Windows, X64, greed-island-desktop, docker]
    timeout-minutes: 15
    steps:
      - name: Check deploy configuration
        shell: powershell
        run: |
          $deployPath = "${{ vars.DEPLOY_PATH }}"
          if (-not $deployPath) {
            Write-Error "DEPLOY_PATH variable is not configured"
          }
          if ($deployPath -match '^/([a-zA-Z])/(.*)$') {
            $deployPath = "$($Matches[1].ToUpper()):\$($Matches[2] -replace '/', '\')"
          }
          if (-not (Test-Path $deployPath)) {
            Write-Error "DEPLOY_PATH does not exist: $deployPath"
          }
          docker version

      - name: Pull & restart on desktop
        shell: powershell
        run: |
          $deployPath = "${{ vars.DEPLOY_PATH }}"
          if ($deployPath -match '^/([a-zA-Z])/(.*)$') {
            $deployPath = "$($Matches[1].ToUpper()):\$($Matches[2] -replace '/', '\')"
          }
          Set-Location $deployPath
          git pull --ff-only
          docker compose pull
          docker compose up -d
          docker compose ps

      - name: Smoke check
        shell: powershell
        run: |
          $deployPath = "${{ vars.DEPLOY_PATH }}"
          if ($deployPath -match '^/([a-zA-Z])/(.*)$') {
            $deployPath = "$($Matches[1].ToUpper()):\$($Matches[2] -replace '/', '\')"
          }
          Set-Location $deployPath
          $envFile = Get-Content .env | Where-Object { $_ -match '^TAILSCALE_BIND_ADDR=' } | Select-Object -First 1
          $bindAddr = $envFile -replace '^TAILSCALE_BIND_ADDR=', ''
          $hostPortLine = Get-Content .env | Where-Object { $_ -match '^GREED_ISLAND_HOST_PORT=' } | Select-Object -First 1
          $hostPort = if ($hostPortLine) { $hostPortLine -replace '^GREED_ISLAND_HOST_PORT=', '' } else { '8100' }
          $baseUrl = "http://${bindAddr}:${hostPort}"

          function Invoke-SmokeCheck($name, $url) {
            for ($attempt = 1; $attempt -le 18; $attempt++) {
              try {
                curl.exe --max-time 20 -fsS $url -o NUL
                Write-Host "$name ok"
                return
              } catch {
                if ($attempt -eq 18) { throw }
                Write-Host "$name not ready yet (attempt $attempt/18); retrying..."
                Start-Sleep -Seconds 5
              }
            }
          }

          Invoke-SmokeCheck "web" "$baseUrl/"
          Invoke-SmokeCheck "api version" "$baseUrl/api/version"
          Invoke-SmokeCheck "api world" "$baseUrl/api/world"
