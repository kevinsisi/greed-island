name: Deploy Dev

# Builds the server and web Docker images, pushes to Docker Hub, then
# deploys to the desktop host over Tailscale SSH. Mirrors the
# HomeProject deployment pattern documented in
# skills/deployment/SKILL.md.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME    Docker Hub user (e.g. kevin950805)
#   DOCKERHUB_TOKEN       Docker Hub access token
#   TS_OAUTH_CLIENT_ID    Tailscale OAuth client id (org-level)
#   TS_OAUTH_SECRET       Tailscale OAuth secret (org-level)
#   DEPLOY_SSH_KEY        Private SSH key authorized on the desktop
#                         host's deploy user
#
# Required GitHub variables (Settings → Secrets and variables →
# Actions → Variables):
#   DEPLOY_HOST           Desktop's Tailscale DNS name
#                         (e.g. desktop.tail-XXXX.ts.net)
#   DEPLOY_USER           SSH user on the desktop (e.g. kevin)
#   DEPLOY_PATH           Path to the deploy directory on the desktop
#                         (e.g. /home/kevin/DockerCompose/greed-island)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  IMAGE_BASE: ${{ secrets.DOCKERHUB_USERNAME }}
  SERVER_IMAGE: greed-island-server
  WEB_IMAGE: greed-island-web

jobs:
  publish:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag-sha: ${{ steps.meta.outputs.tag-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag-sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_BASE }}/${{ env.SERVER_IMAGE }}:dev
            ${{ env.IMAGE_BASE }}/${{ env.SERVER_IMAGE }}:${{ steps.meta.outputs.tag-sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_BASE }}/${{ env.WEB_IMAGE }}:dev
            ${{ env.IMAGE_BASE }}/${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.tag-sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to desktop
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host desktop
              HostName ${{ vars.DEPLOY_HOST }}
              User ${{ vars.DEPLOY_USER }}
              IdentityFile ~/.ssh/id_ed25519
              StrictHostKeyChecking accept-new
              UserKnownHostsFile ~/.ssh/known_hosts
          EOF

      - name: Pull & restart on desktop
        run: |
          ssh desktop "set -e; \
            cd '${{ vars.DEPLOY_PATH }}'; \
            docker compose pull; \
            docker compose up -d; \
            docker compose ps"

      - name: Smoke check
        run: |
          ssh desktop "set -e; \
            cd '${{ vars.DEPLOY_PATH }}'; \
            sleep 3; \
            curl -fsS http://127.0.0.1:\${HOST_PORT:-7100}/ -o /dev/null && echo 'web ok' || (echo 'web smoke failed' && docker compose logs --tail=80 web && exit 1)"
