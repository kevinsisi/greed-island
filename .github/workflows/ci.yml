name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Typecheck (server)
        run: npm run build:server

      - name: Typecheck + bundle (web)
        run: npm run build:web

      - name: Test (server)
        run: npm test

  openspec:
    name: OpenSpec validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.2.0

      - name: Validate all active changes
        # Validates every formal delta spec under openspec/changes/
        # except the archive/. Legacy tracker-only changes without a
        # specs/ directory are skipped because they do not define deltas.
        # Strict mode enforces full schema compliance for real deltas.
        run: |
          set -e
          shopt -s nullglob
          fail=0
          for dir in openspec/changes/*/; do
            name=$(basename "$dir")
            [ "$name" = "archive" ] && continue
            if [ ! -d "$dir/specs" ]; then
              echo "::notice::skip $name (no formal delta specs)"
              continue
            fi
            echo "::group::validate $name"
            if ! openspec validate --changes "$name" --strict; then
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
