name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - feat/tideborn-3d-preview
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Typecheck (server)
        run: npm run build:server

      - name: Typecheck + bundle (web)
        run: npm run build:web

      - name: Test (server)
        run: npm test

  openspec:
    name: OpenSpec validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.2.0

      - name: Validate all active changes
        # Validates every formal delta spec under openspec/changes/
        # except the archive/. Legacy tracker-only changes without a
        # specs/ directory are skipped because they do not define deltas.
        # Strict mode enforces full schema compliance for real deltas.
        run: |
          set -e
          shopt -s nullglob
          fail=0
          for dir in openspec/changes/*/; do
            name=$(basename "$dir")
            [ "$name" = "archive" ] && continue
            if [ ! -d "$dir/specs" ]; then
              echo "::notice::skip $name (no formal delta specs)"
              continue
            fi
            echo "::group::validate $name"
            if ! openspec validate --changes "$name" --strict; then
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

  multiplayer-browser-e2e:
    name: Multiplayer real-browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install project dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build disposable multiplayer server
        run: npm run build:server

      - name: Prepare private job-local fixture directory
        run: |
          MULTIPLAYER_DATA_DIR="$RUNNER_TEMP/greed-mp-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 -p "$MULTIPLAYER_DATA_DIR"
          chmod 700 "$MULTIPLAYER_DATA_DIR"
          echo "MULTIPLAYER_DATA_DIR=$MULTIPLAYER_DATA_DIR" >> "$GITHUB_ENV"

      - name: Install pinned Playwright for this job only
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.63.0

      - name: Install bundled Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run multiplayer browser verification
        run: ./node_modules/.bin/playwright test --config=playwright.config.mjs

      - name: Remove job-local test data and Playwright output
        if: always()
        run: |
          if [ -z "${MULTIPLAYER_DATA_DIR:-}" ]; then exit 0; fi
          case "$MULTIPLAYER_DATA_DIR" in
            "$RUNNER_TEMP"/greed-mp-e2e-*) rm -rf -- "$MULTIPLAYER_DATA_DIR" "${MULTIPLAYER_DATA_DIR}-results" ;;
            *) echo 'Refusing to remove a path outside RUNNER_TEMP.'; exit 1 ;;
          esac

