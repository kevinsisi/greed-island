# Greed Island — desktop-side docker compose.
#
# v1 deployment topology:
#
#   Tailnet client → RPi Caddy (TLS, hunter.sisihome.org)
#                  → desktop tailscale-ip:7100
#                  → web container (nginx-style static + /api proxy)
#                  → server container (Node.js kernel + runtime + AI
#                                      narration worker, port 3000)
#
# This compose file does NOT terminate TLS and does NOT publish the
# public hostname. TLS + hostname routing is the RPi Caddy's job —
# see deploy/rpi-caddy-snippet.Caddyfile for the upstream block.
#
# v1 access policy: TAILSCALE_BIND_ADDR pins the host port to the
# desktop's Tailscale interface so the service is reachable only
# from Tailnet members. Public exposure is a separate later change
# subject to the deployment hardening gate
# (skills/deployment/SKILL.md § 4.1).
#
# Targeted host: AMD Ryzen 7 3700X / 48 GB / RTX 2070 desktop.
# RTX 2070 intentionally unused — AI inference goes to remote
# providers via @kevinsisi/ai-core MultiProviderClient.
#
# Bring up:   docker compose -f deploy/docker-compose.yml up -d --build
# Tail logs:  docker compose -f deploy/docker-compose.yml logs -f --tail=200
# Tear down:  docker compose -f deploy/docker-compose.yml down

name: greed-island

services:
  server:
    build:
      context: ..
      dockerfile: packages/server/Dockerfile
    image: greed-island/server:dev
    container_name: greed-island-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      GREED_ISLAND_DATA_DIR: /app/data
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for accounts}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      GREED_ISLAND_ADMIN_EMAILS: ${GREED_ISLAND_ADMIN_EMAILS:-}
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    networks:
      - greed-island

  web:
    build:
      context: ..
      dockerfile: packages/web/Dockerfile
    image: greed-island/web:dev
    container_name: greed-island-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      # Bind to the desktop host's Tailscale interface only. Set
      # TAILSCALE_BIND_ADDR in deploy/.env (e.g. 100.x.y.z) to keep
      # the service off the public internet. If the var is empty,
      # Docker binds to 0.0.0.0 — DO NOT use that in production.
      - "${TAILSCALE_BIND_ADDR:-0.0.0.0}:${HOST_PORT:-7100}:80"
    networks:
      - greed-island

networks:
  greed-island:
    driver: bridge
